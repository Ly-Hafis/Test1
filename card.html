<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<style>
    *{
        box-sizing: border-box;
    }
    .control{
        width: 100%;
        height: 100vh;
        
        display: flex;
        align-items: center;
    }
    .product{
        margin: auto;
        width: 300px;
        height: auto;
        padding: 15px;
        border-radius: 15px;
        box-shadow: 0 0 5px 0.5px rgb(28, 28, 66);
        font-family: sans-serif;
    }
    .image{
        width: 100%;
        background-color: red;
        height: 320px;
        overflow: hidden;
        border-radius: 10px;
    }
    img{
        width: 100%;
        object-fit: cover;
    }
    .btn button{
        padding: 10px 15px;
        background: blue;
        color: rgb(234, 234, 234);
        border: none;
        border-radius: 5px;
    }
</style>
<body>
    <div class="control">
        <div class="product">
            <div class="image">
                <img src="sony bose.jpg" alt="">
            </div>
            <div class="dis">
                <h3>Wireless Headphones</h3>
                <p>$59.99</p>
                <div class="btn">
                    <button>Add to Card</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
