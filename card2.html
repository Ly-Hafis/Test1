<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .control{
        height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(219, 219, 250);
    }
    .product{
        width: 320px;
        height: 473.4px;
        background-image: url(image/background.jpg);
        background-repeat: no-repeat;
        background-position: center;
        overflow: hidden;
        border-radius: 10px;
        font-family: sans-serif;
        box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        position: relative;
    }
    .icon{
        position: absolute;
        background-color: #5454f4;
        right: 20px;
        top: 20px;
        padding: 5px;
        border-radius: 50%;
        text-align: center;
        width: 28px;
        height: 26px;
        
    }
    i{
        color: rgb(232, 231, 231);
        font-size: 18px;
    }
    .image{
        width: 100%;
        height: 250px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .image img{
        width: 80%;
        object-fit: cover;
    }


    .dis{
        width: 100%;
        height: 50%;
        background-color: white;
        border-radius: 10px;
        padding: 10px 15px;
    }
    .dis span{
        padding: 2px 5px;
        border: 1px solid gray;
        margin-right: 5px;
        font-size: 10px;
        border-radius: 3px;
        margin-top: 5px;
    }
    .dis p{
        line-height: 25px;
    }

    .price-btn{
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
    }
    .btn button{
        border: none;
        padding: 12px 50px;
        background-image: url(image/background.jpg);
        background-repeat: no-repeat;
        background-position: center;
        color: white;
        border-radius: 5px;
    }
</style>
<body>
    <div class="control">
        <div class="product">
            <div class="icon">
                <i class="fa-regular fa-heart"></i>
            </div>
            <div class="image">
                <img src="image/shoes.png" alt="">
            </div>
            <div class="dis">
                <h3>Nike Running Shoe</h3>
                <span>EU38</span>
                <span>BLACK/WHITE</span>
                <br><br>
                <p>Crossing hardwood comfort with off-court flair. '80s-inspired construction, bold details and nothin'-but-net style.</p>
                
                <div class="price-btn">
                    <div class="price">
                        <label for="">PRICE</label>
                        <h3>$69.99</h3>
                    </div>
                    <div class="btn">
                        <button>Add to cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
