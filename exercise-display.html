<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .control {
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        width: 90%;
        margin: auto;
        display: flex;
        gap: 1%;
        flex-wrap: wrap;
    }

    .header {
        width: 100%;
        height: 100px;
        background-color: blueviolet;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        margin-bottom: 1%;
    }

    .navigate {
        width: 100%;
        height: 100px;
        background-color: greenyellow;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        margin-bottom: 1%;
    }

    .footer {
        width: 100%;
        height: 100px;
        background-color: blue;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        margin-bottom: 1%;
    }

    .body {
        width: 100%;
        height: 300px;
        /* background-color: red; */
        display: flex;
        overflow: hidden;
        align-items: center;
        color: white;
        margin-bottom: 1%;
        gap: 1%;
    }

    .aside {
        width: 30%;
        height: 100%;
        background-color: green;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .content-section {
        width: 69%;
        height: 100%;
        /* background-color: black; */
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        flex-wrap: wrap;
    }
    .content {
        width: 100%;
        height: 49%;
        background-color: brown;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        margin-bottom: 1%;
    }
    .section{
        width: 100%;
        height: 49%;
        background-color: aqua;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }
</style>

<body>
    <div class="control">
        <div class="container">
            <div class="header">
                <h1>Header</h1>
            </div>
            <div class="navigate">
                <h1>Navigate</h1>
            </div>

            <div class="body">
                <div class="aside">
                    <h1>Aside</h1>
                </div>
                <div class="content-section">
                    <div class="content">
                        <h1>Content</h1>
                    </div>
                    <div class="section">
                        <h1>Section</h1>
                    </div>
                </div>
            </div>

            <div class="footer">
                <h1>foooter</h1>
            </div>
        </div>
    </div>
</body>

</html>
