<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    .control{
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgb(200, 252, 252);
        font-family: sans-serif;
    }
    form{
        width: 450px;
        height: auto;
        padding: 50px;
        background-color: white;
    }
    form input{
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid gray;
    }
    form input:focus{
        padding: 10px;
        outline: none;
    }

    .pass{
        position: relative;
    }
    i{
        position: absolute;
        right: 10px;
        bottom: 10px;
    }


    label{
        display: block;
        margin-top: 20px;
        margin-bottom: 5px;
        font-weight: bold;
    }
    label a{
        text-decoration: none;
        color: black;
        font-weight: bold;
    }
    p{
        margin: 20px 0px;
    }
    .btn1{
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        background-color: black;
        color: white;
        border: none;
        font-weight: bold;
    }
    .btn2{
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        color: black;
        background-color: white;
        border: 1px solid gray;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }
    .image{
        width: 20px;
        height: 100%;
        margin-right: 10px;
    }
    .image img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        vertical-align: middle;
    }
    .sign-up{
        text-align: center;
        font-size: 12px;
    }
    span{
        font-weight: normal;
    }

</style>
<body>
    <div class="control">
        <form action="">
            <h1>Welcome back</h1>
            <p>Welcome back! Please enter your details.</p>

            <label for="">Email</label>
            <input type="email" placeholder="Enter your email">

            <label for="">Password</label>
            <div class="pass">
                <input type="password" placeholder="Password" class="pass">
                <i class="fa-regular fa-eye"></i>
            </div>
            <label for="">
                <a href="">Forgot password</a>
            </label>

            <button class="btn1">Login</button>
            <button class="btn2">
                <div class="image">
                    <img src="image/google.png" alt="">
                </div>
                <div class="text">
                    Sign in with Google
                </div>
            </button>

            <label for="" class="sign-up">
                <span>Don't have an account?</span>
                <a href="">Sign up for free</a>
            </label>
        </form>
    </div>
</body>
</html>
