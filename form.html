<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    .control{
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container{
        width: 60%;
        height: auto;
        background-image: url(image/background1.jpg);
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        /* background-attachment: fixed; */
        font-family: sans-serif;
        padding: 30px;
        border-radius: 10px;
    }
    form{
        margin: auto;
        width: 35%;
        height: auto;
        backdrop-filter: blur(10px);
        box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        padding: 20px;
        border-radius: 10px;
        color: white;
    }
    form h4{
        text-align: center;
    }
    form input{
        width: 100%;
        padding: 7px 12px;
        border-radius: 5px;
        border: none;
        box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
    form select{
        width: 100%;
        padding: 7px;
        border-radius: 5px;
        border: none;
        box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
    button{
        padding: 7px;
        width: 100%;
        border-radius: 5px;
        border: none;
        background-color: rgb(21, 21, 111);
        color: white;
        margin-top: 30px;
    }
    label{
        margin-top: 15px;
        margin-bottom: 5px;
        display: block;
    }
</style>
<body>
    <div class="control">
        <div class="container">
            <form action="">
                <h4>Register</h4>
                <label for="">Username</label>
                <input type="text" placeholder="Username">
                <label for="">Email</label>
                <input type="email" placeholder="your_email@gamil.com">
                <label for="">Password</label>
                <input type="password" placeholder="password">
                <label for="">Gender</label>
                <select name="" id="">
                    <option value="">Male</option>
                    <option value="">Female</option>
                    <option value="">Other</option>
                </select>
                <button>Login</button>
            </form>
        </div>
    </div>
</body>
</html>
